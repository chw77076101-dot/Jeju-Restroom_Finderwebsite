<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Map Debugger</title>
    <!-- Naver Maps Script with Client ID: yds31td9sh -->
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=yds31td9sh"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        #status {
            padding: 10px;
            border: 1px solid #ccc;
            background: #eee;
            margin-bottom: 10px;
        }

        #map {
            width: 100%;
            height: 400px;
            border: 2px solid red;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Naver Maps Debugger</h1>
    <div id="status">Checking API...</div>
    <div id="map"></div>

    <script>
        const statusDiv = document.getElementById('status');

        // 1. Check if global naver object exists
        if (window.naver && window.naver.maps) {
            statusDiv.innerHTML += '<br><span class="success">[OK] Naver Maps script loaded object successfully.</span>';

            try {
                // 2. Try to initialize map
                var mapOptions = {
                    center: new naver.maps.LatLng(33.4996, 126.5312),
                    zoom: 10
                };
                var map = new naver.maps.Map('map', mapOptions);
                statusDiv.innerHTML += '<br><span class="success">[OK] Map initialized. Check if you see the map below.</span>';

                // 3. Listen for init event (indirectly by checking if tiles load)
                naver.maps.Event.addListener(map, 'init', function () {
                    statusDiv.innerHTML += '<br><span class="success">[OK] Map init event fired.</span>';
                });

            } catch (e) {
                statusDiv.innerHTML += '<br><span class="error">[ERROR] Map crash: ' + e.message + '</span>';
            }

        } else {
            statusDiv.innerHTML = '<span class="error">[FAIL] window.naver is undefined. Script failed to load completely. Check Network tab (F12) for 403/404 on maps.js</span>';
        }
    </script>
</body>

</html>
