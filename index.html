<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeju Restroom Finder</title>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Scripts -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <!-- Kakao Maps Script with User's Key -->
    <script type="text/javascript"
        src="//dapi.kakao.com/v2/maps/sdk.js?appkey=168a004f088bbd9ddde4d63fd5d0b054"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [toilets, setToilets] = useState([]);
            const [userLocation, setUserLocation] = useState(null);
            const [mapInstance, setMapInstance] = useState(null);
            const [nearestList, setNearestList] = useState([]); // List of nearest toilets
            const [isListVisible, setIsListVisible] = useState(false);

            const mapRef = useRef(null);
            const markersRef = useRef({});
            const infoWindowsRef = useRef({});
            const routeLineRef = useRef(null);
            const userMarkerRef = useRef(null);

            // Haversine Formula for distance (km)
            const getDistance = (lat1, lon1, lat2, lon2) => {
                const R = 6371; // Radius of the earth in km
                const dLat = deg2rad(lat2 - lat1);
                const dLon = deg2rad(lon2 - lon1);
                const a =
                    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                const d = R * c; // Distance in km
                return d;
            };

            const deg2rad = (deg) => {
                return deg * (Math.PI / 180);
            };

            // 1. Fetch Data
            useEffect(() => {
                fetch('toilets.json')
                    .then(res => res.json())
                    .then(data => {
                        console.log("Data loaded:", data.length);

                        // Filter for Jeju only (approx Lat 32-34, Lng 126-127) and valid coords
                        const jejuToilets = data.filter(t =>
                            t.lat > 32 && t.lat < 35 &&
                            t.lng > 125 && t.lng < 128 &&
                            t.lat !== 0 && t.lng !== 0
                        );

                        console.log("Filtered Jeju toilets:", jejuToilets.length);
                        setToilets(jejuToilets);
                    })
                    .catch(err => console.error("Failed to load data:", err));
            }, []);

            // 2. Initialize Map (Kakao)
            useEffect(() => {
                if (!mapRef.current) return;
                if (mapInstance) return;

                // Wait for Kakao SDK to load
                if (!window.kakao || !window.kakao.maps) {
                    alert("Kakao Maps API failed to load. Check your API Key and Domain settings.");
                    return;
                }

                kakao.maps.load(() => {
                    const container = mapRef.current;
                    const options = {
                        center: new kakao.maps.LatLng(33.4996, 126.5312), // Jeju City
                        level: 9
                    };

                    const map = new kakao.maps.Map(container, options);
                    setMapInstance(map);
                });

            }, [mapRef]);

            // 3. Render Markers
            useEffect(() => {
                if (!mapInstance || toilets.length === 0) return;

                toilets.forEach(toilet => {
                    if (markersRef.current[toilet.id]) return;

                    const position = new kakao.maps.LatLng(toilet.lat, toilet.lng);

                    // Default marker
                    const marker = new kakao.maps.Marker({
                        position: position,
                        map: mapInstance,
                        title: toilet.name
                    });

                    // Custom Overlay for InfoWindow (Kakao style)
                    // We use basic InfoWindow here for simplicity
                    const contentString = `
                        <div class="popup-content" style="padding:10px; min-width:200px; background:white; border-radius:5px; border:1px solid #ccc;">
                            <h3 style="margin:0 0 5px;">${toilet.name}</h3>
                            <p style="margin:5px 0; font-size:13px; color:#666;">${toilet.address}</p>
                            <p style="margin:5px 0; font-size:13px;"><strong>Open:</strong> ${toilet.openTime}</p>
                            <div style="margin-top:5px;">
                                ${toilet.type === 'Public' ? '<span class="tag">Public</span>' : '<span class="tag">Tourist</span>'}
                                ${toilet.unisex ? '<span class="tag">Unisex</span>' : ''}
                                ${toilet.diaperTable ? '<span class="tag">Diaper Table</span>' : ''}
                            </div>
                        </div>
                    `;

                    const infoWindow = new kakao.maps.InfoWindow({
                        content: contentString,
                        removable: true
                    });

                    kakao.maps.event.addListener(marker, 'click', function () {
                        // Close others
                        Object.values(infoWindowsRef.current).forEach(iw => iw.close());
                        infoWindow.open(mapInstance, marker);
                    });

                    markersRef.current[toilet.id] = marker;
                    infoWindowsRef.current[toilet.id] = infoWindow;
                });

            }, [mapInstance, toilets]);

            // 4. Handle GPS
            const handleFindLocation = () => {
                if (!navigator.geolocation) {
                    alert("Geolocation is not supported by your browser.");
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        const userLatLng = new kakao.maps.LatLng(latitude, longitude);

                        setUserLocation(userLatLng);

                        if (mapInstance) {
                            mapInstance.setCenter(userLatLng);
                            mapInstance.setLevel(4); // Zoom in

                            // User Marker
                            if (userMarkerRef.current) {
                                userMarkerRef.current.setPosition(userLatLng);
                            } else {
                                // Use a different image for user or default marker for now
                                const imageSrc = "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png";
                                const imageSize = new kakao.maps.Size(64, 69);
                                const imageOption = { offset: new kakao.maps.Point(27, 69) };
                                const markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize, imageOption);

                                userMarkerRef.current = new kakao.maps.Marker({
                                    position: userLatLng,
                                    map: mapInstance,
                                    image: markerImage,
                                    zIndex: 1000
                                });
                            }

                            findNearest(latitude, longitude);
                        }
                    },
                    (error) => {
                        console.error(error);
                        alert("Unable to retrieve your location.");
                    }
                );
            };

            const findNearest = (lat, lng) => {
                if (toilets.length === 0) return;

                // Close all info windows
                Object.values(infoWindowsRef.current).forEach(iw => iw.close());

                // Remove existing line
                if (routeLineRef.current) {
                    routeLineRef.current.setMap(null);
                    routeLineRef.current = null;
                }

                // Calculate distance for ALL toilets
                const toiletsWithDist = toilets.map(t => {
                    const distKm = getDistance(lat, lng, t.lat, t.lng);
                    return { ...t, dist: distKm };
                });

                // Sort by distance
                toiletsWithDist.sort((a, b) => a.dist - b.dist);

                // Take top 5
                const top5 = toiletsWithDist.slice(0, 5);
                setNearestList(top5);
                setIsListVisible(true);

                const nearest = top5[0];

                if (nearest && markersRef.current[nearest.id]) {
                    const nearestMarker = markersRef.current[nearest.id];
                    const nearestInfoWindow = infoWindowsRef.current[nearest.id];
                    const userLatLng = new kakao.maps.LatLng(lat, lng);
                    const nearestLatLng = new kakao.maps.LatLng(nearest.lat, nearest.lng);

                    // 1. Open Popup
                    nearestInfoWindow.open(mapInstance, nearestMarker);

                    // 2. Draw Polyline
                    const polyline = new kakao.maps.Polyline({
                        map: mapInstance,
                        path: [userLatLng, nearestLatLng],
                        strokeWeight: 5,
                        strokeColor: '#FF0000',
                        strokeOpacity: 0.7,
                        strokeStyle: 'dashed'
                    });
                    routeLineRef.current = polyline;

                    // 3. Fit Bounds to include user and nearest
                    const bounds = new kakao.maps.LatLngBounds();
                    bounds.extend(userLatLng);
                    bounds.extend(nearestLatLng);

                    // Also extend to include a bit more context if very close
                    mapInstance.setBounds(bounds);
                }
            };

            const handleToiletClick = (toilet) => {
                if (!mapInstance || !markersRef.current[toilet.id]) return;

                const marker = markersRef.current[toilet.id];
                const infoWindow = infoWindowsRef.current[toilet.id];

                // Close others
                Object.values(infoWindowsRef.current).forEach(iw => iw.close());

                // Open this one
                infoWindow.open(mapInstance, marker);
                mapInstance.setCenter(marker.getPosition());
                mapInstance.setLevel(3);
            };

            return (
                <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
                    <header>
                        <h1>Jeju Restroom Finder (Kakao Map) 🚽</h1>
                    </header>
                    <div className="map-container">
                        <div id="map" ref={mapRef}></div>

                        {/* Nearest List Overlay */}
                        <div className={`restroom-list-container ${isListVisible ? 'active' : ''}`}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '10px' }}>
                                <h3 style={{ margin: 0 }}>🚽 Nearest Restrooms</h3>
                                <button onClick={() => setIsListVisible(false)} style={{ background: 'none', border: 'none', fontSize: '1.2rem', cursor: 'pointer' }}>×</button>
                            </div>
                            {/* Debug Info */}
                            {userLocation && (
                                <div style={{ fontSize: '0.8rem', color: '#666', marginBottom: '10px', textAlign: 'center', backgroundColor: '#f0f0f0', padding: '5px', borderRadius: '4px' }}>
                                    📍 인식된 위치: {userLocation.getLat().toFixed(4)}, {userLocation.getLng().toFixed(4)}
                                </div>
                            )}

                            {nearestList.map((toilet) => (
                                <div key={toilet.id} className="restroom-item" onClick={() => handleToiletClick(toilet)}>
                                    <div className="restroom-header">
                                        <span className="restroom-name">{toilet.name}</span>
                                        <span className="restroom-dist">
                                            {toilet.dist < 1
                                                ? `${(toilet.dist * 1000).toFixed(0)}m`
                                                : `${toilet.dist.toFixed(1)}km`}
                                        </span>
                                    </div>
                                    <p className="restroom-address">{toilet.address || "주소 정보 없음"}</p>
                                    <div className="restroom-meta">
                                        {toilet.type === 'Public' ? <span className="tag">Public</span> : <span className="tag">Tourist</span>}
                                        {toilet.diaperTable && <span className="tag">기저귀교환대</span>}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <button className="find-btn" onClick={handleFindLocation}>
                            <span>📍</span> Find Nearest Toilet
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
