<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeju Restroom Finder</title>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Scripts -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <!-- Kakao Maps Script with User's Key -->
    <script type="text/javascript"
        src="//dapi.kakao.com/v2/maps/sdk.js?appkey=168a004f088bbd9ddde4d63fd5d0b054"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [toilets, setToilets] = useState([]);
            const [userLocation, setUserLocation] = useState(null);
            const [mapInstance, setMapInstance] = useState(null);
            const [nearestList, setNearestList] = useState([]);
            const [isListVisible, setIsListVisible] = useState(false);
            const [showMarkers, setShowMarkers] = useState(false); // Default false
            const [isEmergency, setIsEmergency] = useState(false);

            const mapRef = useRef(null);
            const markersRef = useRef({});
            const infoWindowsRef = useRef({});
            const routeLineRef = useRef(null);
            const userMarkerRef = useRef(null);

            // Haversine Formula
            const getDistance = (lat1, lon1, lat2, lon2) => {
                const R = 6371;
                const dLat = deg2rad(lat2 - lat1);
                const dLon = deg2rad(lon2 - lon1);
                const a =
                    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            };

            const deg2rad = (deg) => {
                return deg * (Math.PI / 180);
            };

            // 1. Fetch Data
            useEffect(() => {
                fetch('toilets.json')
                    .then(res => res.json())
                    .then(data => {
                        // Filter for Jeju only (approx Lat 32-34, Lng 126-127) and valid coords
                        const jejuToilets = data.filter(t =>
                            t.lat > 32 && t.lat < 35 &&
                            t.lng > 125 && t.lng < 128 &&
                            t.lat !== 0 && t.lng !== 0
                        );
                        setToilets(jejuToilets);
                    })
                    .catch(err => console.error("Failed to load data:", err));
            }, []);

            // 2. Initialize Map
            useEffect(() => {
                if (!mapRef.current) return;
                if (mapInstance) return;

                if (!window.kakao || !window.kakao.maps) {
                    return;
                }
                kakao.maps.load(() => {
                    const container = mapRef.current;
                    const options = {
                        center: new kakao.maps.LatLng(33.4996, 126.5312), // Jeju City
                        level: 9
                    };
                    const map = new kakao.maps.Map(container, options);
                    setMapInstance(map);
                });
            }, [mapRef]);

            // 3. Render Markers
            useEffect(() => {
                if (!mapInstance || toilets.length === 0) return;

                // Clear existing markers if they should be hidden
                if (!showMarkers) {
                    Object.values(markersRef.current).forEach(m => m.setMap(null));
                    markersRef.current = {};
                    return;
                }

                toilets.forEach(toilet => {
                    if (markersRef.current[toilet.id]) return;

                    const position = new kakao.maps.LatLng(toilet.lat, toilet.lng);

                    // Default marker
                    const marker = new kakao.maps.Marker({
                        position: position,
                        map: mapInstance,
                        title: toilet.name
                    });

                    // Reviews UI
                    const contentString = `
                        <div class="popup-content" style="padding:10px; min-width:200px; background:white; border-radius:10px; border:1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
                            <h3 style="margin:0 0 5px; color:#ff7f00;">${toilet.name}</h3>
                            <p style="margin:5px 0; font-size:13px; color:#666;">${toilet.address}</p>
                            <div style="margin-top:8px; border-top:1px solid #eee; padding-top:8px; display:flex; gap:5px;">
                                <button onclick="window.submitReview(${toilet.id}, 'good')" style="border:1px solid #ddd; background:white; border-radius:12px; padding:4px 8px; cursor:pointer; font-size:12px;">👍 좋아요</button>
                                <button onclick="window.submitReview(${toilet.id}, 'bad')" style="border:1px solid #ddd; background:white; border-radius:12px; padding:4px 8px; cursor:pointer; font-size:12px;">👎 별로</button>
                            </div>
                        </div>
                    `;

                    const infoWindow = new kakao.maps.InfoWindow({
                        content: contentString,
                        removable: true
                    });

                    kakao.maps.event.addListener(marker, 'click', function () {
                        Object.values(infoWindowsRef.current).forEach(iw => iw.close());
                        infoWindow.open(mapInstance, marker);
                    });

                    markersRef.current[toilet.id] = marker;
                    infoWindowsRef.current[toilet.id] = infoWindow;
                });
            }, [mapInstance, toilets, showMarkers]);

            // Find Nearest Logic
            const findNearest = (lat, lng, limit) => {
                if (toilets.length === 0) return;

                Object.values(infoWindowsRef.current).forEach(iw => iw.close());

                if (routeLineRef.current) {
                    routeLineRef.current.setMap(null);
                    routeLineRef.current = null;
                }

                const toiletsWithDist = toilets.map(t => {
                    const distKm = getDistance(lat, lng, t.lat, t.lng);
                    return { ...t, dist: distKm };
                });

                toiletsWithDist.sort((a, b) => a.dist - b.dist);

                const top = toiletsWithDist.slice(0, limit);
                setNearestList(top);
                setIsListVisible(true);

                const nearest = top[0];
                if (nearest && markersRef.current[nearest.id]) {
                    const marker = markersRef.current[nearest.id];
                    const infoWindow = infoWindowsRef.current[nearest.id];

                    // Open popup for the nearest one
                    infoWindow.open(mapInstance, marker);

                    const line = new kakao.maps.Polyline({
                        map: mapInstance,
                        path: [new kakao.maps.LatLng(lat, lng), new kakao.maps.LatLng(nearest.lat, nearest.lng)],
                        strokeWeight: 6,
                        strokeColor: '#FF0000',
                        strokeOpacity: 0.8,
                        strokeStyle: 'solid'
                    });
                    routeLineRef.current = line;

                    const bounds = new kakao.maps.LatLngBounds();
                    bounds.extend(new kakao.maps.LatLng(lat, lng));
                    bounds.extend(new kakao.maps.LatLng(nearest.lat, nearest.lng));

                    // In emergency (limit=1), we might want tighter zoom, but bounds usually works well
                    mapInstance.setBounds(bounds);
                }
            };

            const handleFindLocation = (mode = 'normal') => {
                if (!navigator.geolocation) {
                    alert("Geolocation is not supported.");
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        const userLatLng = new kakao.maps.LatLng(latitude, longitude);
                        setUserLocation(userLatLng);

                        if (mapInstance) {
                            mapInstance.setCenter(userLatLng);

                            // User Marker
                            if (userMarkerRef.current) {
                                userMarkerRef.current.setPosition(userLatLng);
                            } else {
                                const imageSrc = "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png";
                                const imageSize = new kakao.maps.Size(64, 69);
                                const imageOption = { offset: new kakao.maps.Point(27, 69) };
                                const markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize, imageOption);
                                userMarkerRef.current = new kakao.maps.Marker({
                                    position: userLatLng,
                                    map: mapInstance,
                                    image: markerImage,
                                    zIndex: 1000
                                });
                            }

                            if (mode === 'emergency') {
                                setIsEmergency(true);
                                setShowMarkers(true); // Must show them to find nearest
                                // Slightly defer to ensure state update or marker render?
                                // React effects run after render, so direct call is fine if markers exist.
                                // But if showMarkers was false, we need to wait for effect to render markers first?
                                // Actually, 'findNearest' uses markersRef.current.
                                // If we just set showMarkers(true), the effect to create markers runs *after* this render cycle.
                                // So we need a timeout or useEffect dependency.
                                // Simple fix: use setTimeout(..., 100) or check in useEffect.
                                // Let's use setTimeout for safety in this simple app.
                                setTimeout(() => findNearest(latitude, longitude, 1), 200);
                            } else {
                                setIsEmergency(false);
                                setShowMarkers(true);
                                setTimeout(() => findNearest(latitude, longitude, 5), 200);
                            }
                        }
                    },
                    (error) => {
                        console.error(error);
                        alert("Unable to retrieve location.");
                    }
                );
            };

            const handleToiletClick = (toilet) => {
                if (!mapInstance || !markersRef.current[toilet.id]) return;
                const marker = markersRef.current[toilet.id];
                const infoWindow = infoWindowsRef.current[toilet.id];

                Object.values(infoWindowsRef.current).forEach(iw => iw.close());
                infoWindow.open(mapInstance, marker);
                mapInstance.setCenter(marker.getPosition());
                mapInstance.setLevel(3);
            };

            return (
                <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
                    <header>
                        <h1>Jeju Restroom Finder 🚽</h1>
                    </header>
                    <div className="map-container">
                        <div id="map" ref={mapRef}></div>

                        {/* Nearest List Overlay */}
                        <div className={`restroom-list-container ${isListVisible ? 'active' : ''}`}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '10px' }}>
                                <h3 style={{ margin: 0 }}>🚽 Nearest Restrooms</h3>
                                <button onClick={() => setIsListVisible(false)} style={{ background: 'none', border: 'none', fontSize: '1.2rem', cursor: 'pointer' }}>×</button>
                            </div>

                            {userLocation && (
                                <div style={{ fontSize: '0.8rem', color: '#666', marginBottom: '10px', textAlign: 'center', backgroundColor: '#f0f0f0', padding: '5px', borderRadius: '4px' }}>
                                    📍 인식된 위치: {userLocation.getLat().toFixed(4)}, {userLocation.getLng().toFixed(4)}
                                </div>
                            )}

                            {nearestList.map((toilet) => (
                                <div key={toilet.id} className="restroom-item" onClick={() => handleToiletClick(toilet)}>
                                    <div className="restroom-header">
                                        <span className="restroom-name">{toilet.name}</span>
                                        <span className="restroom-dist">
                                            {toilet.dist < 1
                                                ? `${(toilet.dist * 1000).toFixed(0)}m`
                                                : `${toilet.dist.toFixed(1)}km`}
                                        </span>
                                    </div>
                                    <p className="restroom-address">{toilet.address || "주소 정보 없음"}</p>
                                    <div className="restroom-meta">
                                        {toilet.type === 'Public' ? <span className="tag">Public</span> : <span className="tag">Tourist</span>}
                                        {toilet.diaperTable && <span className="tag">기저귀교환대</span>}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <button className="find-btn" onClick={() => handleFindLocation('normal')}>
                            <span>📍</span> 내 주변 화장실
                        </button>

                        <button
                            onClick={() => handleFindLocation('emergency')}
                            style={{
                                position: 'absolute',
                                bottom: '150px',
                                right: '20px',
                                width: '80px',
                                height: '80px',
                                borderRadius: '50%',
                                border: 'none',
                                background: '#dc3545', /* Warning Red */
                                color: 'white',
                                fontWeight: 'bold',
                                fontSize: '1.2rem',
                                boxShadow: '0 4px 10px rgba(0,0,0,0.3)',
                                zIndex: 1000,
                                cursor: 'pointer',
                                display: 'flex',
                                flexDirection: 'column',
                                alignItems: 'center',
                                justifyContent: 'center',
                                animation: 'pulse 2s infinite'
                            }}
                        >
                            <span style={{ fontSize: '1.5rem', marginBottom: '2px' }}>🚨</span>
                            <span style={{ fontSize: '0.8rem' }}>급해요</span>
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
        // Global review stub
        window.submitReview = (id, type) => {
            alert(`Review submitted for ID ${id}: ${type}!\n(This is a demo feature)`);
            const span = document.getElementById(`score-${id}`);
            if (span) span.innerText = "(1)";
        };
    </script>
</body>

</html>
