<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>제주도 전지역 화장실 - Premium</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Scripts -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Kakao Maps Script -->
    <script type="text/javascript"
        src="//dapi.kakao.com/v2/maps/sdk.js?appkey=168a004f088bbd9ddde4d63fd5d0b054&libraries=services&autoload=false"></script>

    <!-- Data -->
    <script src="jeju_olle_data.js"></script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="pwa_icon_512.png">
    <meta name="theme-color" content="#ff7f00">
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const translations = {
            KR: {
                title: "제주 화장실 찾기",
                help: "가이드",
                olleSelect: "🚶 올레길 코스 선택",
                showAll: "🗺️ 전지역 보기",
                searchPlaceholder: "지역/주소 검색 (예: 성산읍)",
                myLocation: "📍 내 주변 찾기",
                nearList: "🚽 가까운 화장실",
                emergency: "🚨 급해요",
                addressInfo: "주소 정보 없음",
                diaper: "기저귀 교환",
                unisex: "공용",
                open24h: "24시",
                confirm: "확인"
            },
            EN: {
                title: "Jeju Restroom",
                help: "Guide",
                olleSelect: "🚶 Olle Trail Courses",
                showAll: "🗺️ Show All",
                searchPlaceholder: "Search area (e.g. Seongsan)",
                myLocation: "📍 Find Nearby",
                nearList: "🚽 Nearby Restrooms",
                emergency: "🚨 SOS",
                addressInfo: "No Address Info",
                diaper: "Diaper",
                unisex: "Unisex",
                open24h: "24H",
                confirm: "OK"
            }
        };

        function App() {
            const [toilets, setToilets] = useState([]);
            const [userLocation, setUserLocation] = useState(null);
            const [mapInstance, setMapInstance] = useState(null);
            const [nearestList, setNearestList] = useState([]);
            const [isListVisible, setIsListVisible] = useState(false);
            const [showMarkers, setShowMarkers] = useState(false);
            const [isEmergency, setIsEmergency] = useState(false);
            const [selectedCourse, setSelectedCourse] = useState(null);
            const [showAll, setShowAll] = useState(false);
            const [language, setLanguage] = useState('KR');
            const [isLoading, setIsLoading] = useState(false);
            
            // Feature Filters
            const [featureFilters, setFeatureFilters] = useState({
                diaper: false,
                open24h: false
            });

            const [searchAddress, setSearchAddress] = useState("");
            const [searchRadius, setSearchRadius] = useState(0); 
            const [searchCenter, setSearchCenter] = useState(null);

            const mapRef = useRef(null);
            const markersRef = useRef({});
            const infoWindowsRef = useRef({});
            const routeLineRef = useRef(null);
            const userMarkerRef = useRef(null);
            const ollePolylineRef = useRef(null);
            const radiusCircleRef = useRef(null);
            const searchMarkerRef = useRef(null);

            const t = (key) => translations[language][key] || translations['KR'][key];

            // Distance Utility
            const getDistance = (lat1, lon1, lat2, lon2) => {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            };

            // 1. Fetch & Init
            useEffect(() => {
                fetch('toilets.json')
                    .then(res => res.json())
                    .then(data => {
                        const jejuToilets = data.filter(t =>
                            t.lat > 32 && t.lat < 35 &&
                            t.lng > 125 && t.lng < 128 &&
                            t.lat !== 0 && t.lng !== 0
                        );
                        setToilets(jejuToilets);
                    })
                    .catch(err => console.error("Data error:", err));

                if (window.kakao && window.kakao.maps) {
                    kakao.maps.load(() => {
                        const container = mapRef.current;
                        const options = {
                            center: new kakao.maps.LatLng(33.450701, 126.570667),
                            level: 9
                        };
                        const map = new kakao.maps.Map(container, options);
                        setMapInstance(map);
                    });
                }
            }, []);

            // 2. Filtered Toilets
            const filteredToilets = useMemo(() => {
                let result = [...toilets];

                // Apply Feature Filters
                if (featureFilters.diaper) result = result.filter(t => t.diaperTable);
                if (featureFilters.open24h) result = result.filter(t => t.openTime === '상시');

                // Apply Mode Filters
                if (isEmergency && nearestList.length > 0) {
                    return nearestList.filter(t => result.find(rt => rt.id === t.id));
                } else if (showAll) {
                    return result;
                } else if (selectedCourse && window.OLLE_COURSES) {
                    const coursePath = window.OLLE_COURSES[selectedCourse].path;
                    return result.filter(t => coursePath.some(pt => getDistance(t.lat, t.lng, pt.lat, pt.lng) < 1.5));
                } else if (searchCenter && searchRadius > 0) {
                    const cLat = searchCenter.getLat();
                    const cLng = searchCenter.getLng();
                    return result.filter(t => getDistance(cLat, cLng, t.lat, t.lng) <= searchRadius);
                }
                
                return showMarkers ? result : [];
            }, [toilets, featureFilters, isEmergency, nearestList, showAll, selectedCourse, searchCenter, searchRadius, showMarkers]);

            // 3. Render Markers
            useEffect(() => {
                if (!mapInstance) return;

                // Clear unused
                const activeIds = filteredToilets.map(t => String(t.id));
                Object.keys(markersRef.current).forEach(id => {
                    if (!activeIds.includes(id)) {
                        markersRef.current[id].setMap(null);
                        delete markersRef.current[id];
                        if(infoWindowsRef.current[id]) infoWindowsRef.current[id].close();
                    }
                });

                // Add new
                filteredToilets.forEach(toilet => {
                    if (markersRef.current[toilet.id]) return;

                    const pos = new kakao.maps.LatLng(toilet.lat, toilet.lng);
                    const marker = new kakao.maps.Marker({
                        position: pos,
                        map: mapInstance,
                        title: toilet.name
                    });

                    const content = `
                        <div class="popup-content">
                            <h3 class="popup-title">${toilet.name}</h3>
                            <p style="font-size:12px; color:#666; margin:0;">${toilet.address}</p>
                            <div class="nav-buttons">
                                <a href="https://map.kakao.com/link/to/${toilet.name},${toilet.lat},${toilet.lng}" target="_blank" class="nav-link nav-kakao">Kakao</a>
                                <a href="https://map.naver.com/v5/directions/-/,,${toilet.lat},${toilet.lng},${toilet.name}/" target="_blank" class="nav-link nav-naver">Naver</a>
                                <a href="https://www.google.com/maps/dir/?api=1&destination=${toilet.lat},${toilet.lng}" target="_blank" class="nav-link nav-google">Google</a>
                            </div>
                        </div>
                    `;

                    const iw = new kakao.maps.InfoWindow({ content, removable: true });
                    
                    kakao.maps.event.addListener(marker, 'click', () => {
                        Object.values(infoWindowsRef.current).forEach(w => w.close());
                        iw.open(mapInstance, marker);
                        mapInstance.panTo(pos);
                        drawRouteLine(pos);
                    });

                    markersRef.current[toilet.id] = marker;
                    infoWindowsRef.current[toilet.id] = iw;
                });
            }, [mapInstance, filteredToilets]);

            const drawRouteLine = (targetPos) => {
                if (!userLocation || !mapInstance) return;
                if (routeLineRef.current) routeLineRef.current.setMap(null);
                
                const line = new kakao.maps.Polyline({
                    map: mapInstance,
                    path: [userLocation, targetPos],
                    strokeWeight: 5,
                    strokeColor: '#ff7f00',
                    strokeOpacity: 0.7,
                    strokeStyle: 'solid'
                });
                routeLineRef.current = line;
            };

            const handleFindLocation = (mode = 'normal') => {
                if (!navigator.geolocation) return;
                setIsLoading(true);
                setShowAll(false);
                setSelectedCourse(null);

                navigator.geolocation.getCurrentPosition((pos) => {
                    const { latitude, longitude } = pos.coords;
                    const latLng = new kakao.maps.LatLng(latitude, longitude);
                    setUserLocation(latLng);
                    mapInstance.setCenter(latLng);

                    // User icon
                    if (userMarkerRef.current) {
                        userMarkerRef.current.setPosition(latLng);
                    } else {
                        userMarkerRef.current = new kakao.maps.Marker({
                            position: latLng,
                            map: mapInstance,
                            image: new kakao.maps.MarkerImage('https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png', new kakao.maps.Size(32, 34))
                        });
                    }

                    if (mode === 'emergency') {
                        setIsEmergency(true);
                        const sorted = toilets.map(t => ({ ...t, dist: getDistance(latitude, longitude, t.lat, t.lng) }))
                                             .sort((a, b) => a.dist - b.dist)
                                             .slice(0, 5);
                        setNearestList(sorted);
                        setIsListVisible(true);
                    } else {
                        setSearchCenter(latLng);
                        updateRadiusUI(latLng, 1);
                    }
                    setIsLoading(false);
                }, () => setIsLoading(false), { enableHighAccuracy: true });
            };

            const updateRadiusUI = (center, km) => {
                setSearchRadius(km);
                if (radiusCircleRef.current) radiusCircleRef.current.setMap(null);
                const circle = new kakao.maps.Circle({
                    center, radius: km * 1000,
                    strokeWeight: 1, strokeColor: '#ff7f00', strokeOpacity: 0.8,
                    fillColor: '#ff7f00', fillOpacity: 0.1, map: mapInstance
                });
                radiusCircleRef.current = circle;
                const bounds = new kakao.maps.LatLngBounds();
                const d = km * 0.012;
                bounds.extend(new kakao.maps.LatLng(center.getLat() - d, center.getLng() - d));
                bounds.extend(new kakao.maps.LatLng(center.getLat() + d, center.getLng() + d));
                mapInstance.setBounds(bounds);
            };

            const handleOlleSelect = (id) => {
                if (!id) {
                    setSelectedCourse(null);
                    if (ollePolylineRef.current) ollePolylineRef.current.setMap(null);
                    return;
                }
                const course = window.OLLE_COURSES[id];
                setSelectedCourse(id);
                setShowAll(false);
                setSearchCenter(null);
                if (ollePolylineRef.current) ollePolylineRef.current.setMap(null);
                
                const path = course.path.map(p => new kakao.maps.LatLng(p.lat, p.lng));
                const poly = new kakao.maps.Polyline({
                    map: mapInstance, path,
                    strokeWeight: 6, strokeColor: course.color, strokeOpacity: 0.8
                });
                ollePolylineRef.current = poly;
                const bounds = new kakao.maps.LatLngBounds();
                path.forEach(p => bounds.extend(p));
                mapInstance.setBounds(bounds);
            };

            return (
                <div id="root">
                    {isLoading && (
                        <div style={{position:'fixed', inset:0, background:'rgba(255,255,255,0.8)', zIndex:9999, display:'flex', alignItems:'center', justifyContent:'center'}}>
                            <div className="pulse-glow" style={{width:20, height:20, background:'var(--primary)', borderRadius:'50%'}}></div>
                        </div>
                    )}

                    <header>
                        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                            <h1>🍊 {t('title')}</h1>
                            <div style={{display:'flex', gap:'8px'}}>
                                <button className="filter-badge" onClick={() => setLanguage(language==='KR'?'EN':'KR')}>{language}</button>
                            </div>
                        </div>

                        <div style={{display:'flex', gap:'8px'}}>
                            <div style={{flex:1, position:'relative'}}>
                                <input 
                                    className="filter-badge" 
                                    style={{width:'100%', padding:'10px 15px', borderRadius:'12px', border:'1px solid var(--border)'}}
                                    placeholder={t('searchPlaceholder')}
                                    value={searchAddress}
                                    onChange={e => setSearchAddress(e.target.value)}
                                    onKeyPress={e => e.key === 'Enter' && alert('Search not implemented yet with premium Geocoder')}
                                />
                            </div>
                        </div>

                        <div className="filter-container">
                            <button className={`filter-badge ${showAll ? 'active' : ''}`} onClick={() => {setShowAll(!showAll); setSelectedCourse(null); setSearchCenter(null);}}>
                                {t('showAll')}
                            </button>
                            <select className="filter-badge" onChange={e => handleOlleSelect(e.target.value)} value={selectedCourse || ""}>
                                <option value="">{t('olleSelect')}</option>
                                {window.OLLE_COURSES && Object.keys(window.OLLE_COURSES).map(id => (
                                    <option key={id} value={id}>{window.OLLE_COURSES[id].name}</option>
                                ))}
                            </select>
                        </div>

                        <div className="filter-container">
                            <button className={`filter-badge ${featureFilters.diaper ? 'active' : ''}`} onClick={() => setFeatureFilters({...featureFilters, diaper: !featureFilters.diaper})}>
                                👶 {t('diaper')}
                            </button>
                            <button className={`filter-badge ${featureFilters.open24h ? 'active' : ''}`} onClick={() => setFeatureFilters({...featureFilters, open24h: !featureFilters.open24h})}>
                                🌙 {t('open24h')}
                            </button>
                            <button className="filter-badge" style={{background:'var(--primary-soft)', color:'var(--primary)'}} onClick={() => handleFindLocation('normal')}>
                                {t('myLocation')}
                            </button>
                        </div>
                    </header>

                    <main className="map-container">
                        <div id="map" ref={mapRef}></div>

                        <button className="sos-button pulse-glow" onClick={() => handleFindLocation('emergency')}>
                            <span className="sos-icon">🚨</span>
                            <span className="sos-text">{t('emergency')}</span>
                        </button>

                        <div className={`restroom-list-container ${isListVisible ? 'active' : ''}`}>
                            <div style={{display:'flex', justifyContent:'space-between', marginBottom:'15px'}}>
                                <h3 style={{margin:0, fontWeight:800}}>{t('nearList')}</h3>
                                <button onClick={() => setIsListVisible(false)} style={{background:'none', border:'none', fontSize:'1.5rem', cursor:'pointer'}}>×</button>
                            </div>
                            {nearestList.map(toilet => (
                                <div key={toilet.id} className="restroom-item animate-fade-in" onClick={() => {
                                    const pos = new kakao.maps.LatLng(toilet.lat, toilet.lng);
                                    mapInstance.panTo(pos);
                                    infoWindowsRef.current[toilet.id].open(mapInstance, markersRef.current[toilet.id]);
                                    drawRouteLine(pos);
                                }}>
                                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
                                        <div>
                                            <span className="restroom-name">{toilet.name}</span>
                                            <span className="restroom-dist">
                                                {toilet.dist < 1 ? `${(toilet.dist * 1000).toFixed(0)}m` : `${toilet.dist.toFixed(1)}km`}
                                            </span>
                                        </div>
                                    </div>
                                    <p className="restroom-address">{toilet.address}</p>
                                    <div style={{display:'flex', gap:'5px'}}>
                                        {toilet.diaperTable && <span className="tag premium">👶 기저귀</span>}
                                        {toilet.openTime === '상시' && <span className="tag premium">🌙 24H</span>}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
